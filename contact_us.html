<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TravelBloom</title>
  <link rel="stylesheet" href="./travel_recommendation.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <a href="./index.html" class="nav-brand">
      <div class="brand-icon">
        <i class="fa-solid fa-plane-departure"></i>
      </div>
      <span class="brand-name">TravelBloom</span>
    </a>

    <ul class="nav-links">
      <li><a href="./index.html">Home</a></li>
      <li><a href="./about_us.html">About Us</a></li>
      <li><a href="./contact_us.html" class="active">Contact Us</a></li>
    </ul>
  </nav>

  <aside class="social-sidebar">
    <a href="https://twitter.com" target="_blank" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
    <a href="https://facebook.com" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="https://instagram.com" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
    <a href="https://youtube.com" target="_blank" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
  </aside>

  <main class="contact-page-content">
    <div class="contact-left">
      <h1 class="contact-title">CONTACT US</h1>
      <p class="contact-subtitle">Get in touch</p>
    </div>

    <div class="contact-right">
      <form class="contact-form-box" id="contactForm" onsubmit="event.preventDefault(); alert('Thank you for contacting us! We will get back to you soon.'); this.reset();">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" class="form-input" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" class="form-textarea" placeholder="Enter your message" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit</button>
      </form>
    </div>
  </main>
</body>
</html>
